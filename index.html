<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b12">
<title>Momentum Daily OS V5</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f5f7fb;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}
.sidebar{width:240px;position:fixed;inset:0 auto 0 0;padding:24px 16px;background:#0c0f17;border-right:1px solid #242a38;z-index:10}
.logo{font-size:21px;font-weight:900;padding:8px 10px 25px}.logo span{color:#8b7cff}
.nav button{width:100%;border:0;background:transparent;color:#8992a5;padding:13px 12px;border-radius:12px;text-align:left;margin:3px 0}.nav button.active,.nav button:hover{background:#181d2a;color:white}
.main{margin-left:240px;width:calc(100% - 240px);padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.top h1{margin:0;font-size:30px}.muted{color:#8d96aa}.small{font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:1px solid #2b3242;background:#151a26;color:#fff;border-radius:11px;padding:9px 13px}.btn.primary{background:#7567e8;border-color:#7567e8}.btn.good{background:#164236;border-color:#245d4e}.btn.danger{color:#ff8d9e}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:linear-gradient(145deg,#121722,#0f131c);border:1px solid #252c3b;border-radius:18px;padding:18px;box-shadow:0 14px 35px #0004}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8992a5}.metric{font-size:32px;font-weight:900;margin:5px 0 9px}.progress{height:8px;border-radius:20px;background:#252b39;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#8b7cff,#35d6b0)}
.activity{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #252b39}.activity:last-child{border-bottom:0}.icon{width:40px;height:40px;display:grid;place-items:center;background:#191f2c;border-radius:12px;font-size:20px}.activity-actions{display:flex;gap:6px;align-items:center}.check{width:31px;height:31px;border:1px solid #343c4e;border-radius:9px;background:#121722;color:#fff}.check.done{background:#7567e8;border-color:#7567e8}
.form{display:flex;gap:8px;flex-wrap:wrap}.input{background:#0d1119;border:1px solid #2a3140;color:white;border-radius:10px;padding:10px}.timeline{height:520px;position:relative;background:#0b0f16;border:1px solid #252c3b;border-radius:14px;overflow:hidden}.hour{position:absolute;left:0;right:0;border-top:1px solid #202633}.hour span{position:absolute;left:6px;top:3px;color:#697388;font-size:10px}.event{position:absolute;left:58px;right:10px;border-radius:8px;padding:4px 8px;overflow:hidden;font-size:11px;background:#3a3267;border:1px solid #6256aa}.event.sleep{background:#193c4d;border-color:#2d708b}.event.free{background:#244c3f;border-color:#377b65}
.chart{width:100%;height:260px}.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:12px;color:#9ba3b4}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.daycell{min-height:75px;text-align:left}.editrow{display:grid;grid-template-columns:55px 1fr 100px auto;gap:8px;align-items:center;margin-bottom:9px}
.toast{position:fixed;right:20px;bottom:20px;background:#171d29;border:1px solid #30384a;padding:12px 15px;border-radius:12px;display:none;z-index:50}.toast.show{display:block}
.bottom{display:none}
@media(max-width:850px){.sidebar{display:none}.main{margin:0;width:100%;padding:18px 14px 85px}.grid{grid-template-columns:1fr}.s3,.s4,.s6,.s8,.s12{grid-column:span 1}.bottom{position:fixed;display:flex;z-index:20;bottom:0;left:0;right:0;height:66px;background:#0b0e15f5;border-top:1px solid #252c39}.bottom button{flex:1;border:0;background:transparent;color:#8992a5}.bottom button.active{color:white}.timeline{height:470px}.top{align-items:flex-start}.editrow{grid-template-columns:45px 1fr auto}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">MOMENTUM <span>V5</span></div>
  <div class="nav">
    <button data-page="today">◉ Oggi</button>
    <button data-page="stats">◌ Statistiche</button>
    <button data-page="calendar">▦ Calendario</button>
    <button data-page="activities">☷ Attività</button>
    <button data-page="sync">☁ Backup & Sync</button>
  </div>
</aside>

<main class="main">
  <div class="top">
    <div><h1 id="page-title">Oggi</h1><div class="muted" id="date-label"></div></div>
    <div class="actions">
      <button class="btn" id="prev">‹</button>
      <button class="btn" id="today-btn">Oggi</button>
      <button class="btn" id="next">›</button>
    </div>
  </div>
  <div id="content"></div>
</main>
</div>

<nav class="bottom">
<button data-page="today">Oggi</button><button data-page="stats">Stats</button><button data-page="calendar">Calendario</button><button data-page="activities">Attività</button><button data-page="sync">Sync</button>
</nav>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const STORAGE="momentum_v5_fixed";
const defaultActivities=[
{id:"wake",name:"Sveglia",icon:"⏰",category:"routine",goal:1},
{id:"school",name:"Scuola",icon:"🏫",category:"school",goal:300},
{id:"study",name:"Studio",icon:"📚",category:"study",goal:90},
{id:"workout",name:"Allenamento",icon:"🏋️",category:"workout",goal:60},
{id:"band",name:"Band",icon:"🎸",category:"hobby",goal:60},
{id:"free",name:"Tempo libero",icon:"🎮",category:"free",goal:120}
];
let state=load();
let selected=new Date(); selected.setHours(12,0,0,0);
let currentPage="today";
let activeTimer=null;

function load(){
 try{
  const raw=localStorage.getItem(STORAGE);
  if(raw){
   const x=JSON.parse(raw);
   return {activities:Array.isArray(x.activities)?x.activities:defaultActivities,days:x.days||{}};
  }
 }catch(e){}
 return {activities:JSON.parse(JSON.stringify(defaultActivities)),days:{}};
}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch(e){toast("Impossibile salvare nel browser");}}
function dayKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function getDay(d){
 const k=dayKey(d);
 if(!state.days[k]) state.days[k]={done:{},events:[],sleep:null};
 return state.days[k];
}
function fmtDate(d){return d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function fmtMin(n){n=Math.max(0,Math.round(n||0));return Math.floor(n/60)+"h "+String(n%60).padStart(2,"0")+"m"}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2200)}
function activityMinutes(d){return getDay(d).events.reduce((s,e)=>s+Math.max(0,(e.end-e.start)/60000),0)}
function sleepMinutes(d){
 const s=getDay(d).sleep;if(!s)return 0;
 const end=s.end||Date.now();
 return Math.max(0,(end-s.start)/60000);
}
function nav(page){currentPage=page;render()}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>nav(b.dataset.page)));
document.getElementById("prev").onclick=()=>{selected.setDate(selected.getDate()-1);render()};
document.getElementById("next").onclick=()=>{selected=new Date();selected.setHours(12,0,0,0);selected.setDate(selected.getDate()+1);render()};
document.getElementById("today-btn").onclick=()=>{selected=new Date();selected.setHours(12,0,0,0);render()};

function addEvent(d,a,start,end){
 getDay(d).events.push({id:"e"+Date.now()+Math.random(),activity:a.id,name:a.name,category:a.category,start,end});
}
function toggleActivity(id){
 const a=state.activities.find(x=>x.id===id),d=getDay(selected);
 d.done[id]=!d.done[id];
 save();render();
 if(d.done[id] && id!=="wake"){
  setTimeout(()=>{
   const answer=prompt("Quanti minuti hai dedicato a "+a.name+"?","30");
   const m=parseFloat(answer);
   if(Number.isFinite(m)&&m>0){
    const end=Date.now();addEvent(selected,a,end-m*60000,end);save();render();toast("Tempo registrato");
   }
  },30);
 }
}
function timerToggle(id){
 if(activeTimer){
  const a=state.activities.find(x=>x.id===activeTimer.id);
  const end=Date.now();addEvent(selected,a,activeTimer.start,end);getDay(selected).done[id]=true;
  activeTimer=null;save();render();toast("Timer salvato");
 }else{
  activeTimer={id,start:Date.now()};render();toast("Timer avviato");
 }
}
function sleepToggle(){
 const d=getDay(selected),now=Date.now();
 if(d.sleep&&!d.sleep.end){d.sleep.end=now;save();render();toast("Sveglia registrata");return}
 d.sleep={start:now,end:null};d.done.sleep=true;save();render();toast("Ora di andare a letto registrata");
}
function wakePreviousNight(){
 const prev=new Date(selected);prev.setDate(prev.getDate()-1);
 const pd=getDay(prev);
 if(pd.sleep&&!pd.sleep.end){
  pd.sleep.end=Date.now();
  getDay(selected).sleep={start:pd.sleep.start,end:pd.sleep.end,carried:true};
  save();render();toast("Sonno della notte precedente chiuso");
  return true;
 }
 return false;
}
function render(){
 document.getElementById("page-title").textContent={today:"Oggi",stats:"Statistiche",calendar:"Calendario",activities:"Attività",sync:"Backup & Sync"}[currentPage];
 document.getElementById("date-label").textContent=fmtDate(selected);
 document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===currentPage));
 ({today:renderToday,stats:renderStats,calendar:renderCalendar,activities:renderActivities,sync:renderSync}[currentPage])();
}
function renderToday(){
 const d=getDay(selected), total=state.activities.length, done=state.activities.filter(a=>d.done[a.id]).length;
 const pct=total?Math.round(done/total*100):0, act=activityMinutes(selected), sleep=sleepMinutes(selected), untracked=Math.max(0,1440-act-sleep);
 const rows=state.activities.map(a=>`
 <div class="activity">
  <div class="icon">${a.icon}</div>
  <div><b>${esc(a.name)}</b><div class="small muted">${d.done[a.id]?"Completata":"Non completata"} · obiettivo ${a.goal||0} min</div></div>
  <div class="activity-actions">
   <button class="btn" onclick="window.mTimer('${a.id}')">${activeTimer&&activeTimer.id===a.id?"■":"▶"}</button>
   <button class="check ${d.done[a.id]?"done":""}" onclick="window.mToggle('${a.id}')">${d.done[a.id]?"✓":"○"}</button>
  </div>
 </div>`).join("");
 const sleeping=d.sleep&&!d.sleep.end;
 document.getElementById("content").innerHTML=`
 <div class="grid">
  <div class="card s3"><div class="label">Completamento</div><div class="metric">${pct}%</div><div class="progress"><span style="width:${pct}%"></span></div></div>
  <div class="card s3"><div class="label">Attività registrate</div><div class="metric">${fmtMin(act)}</div></div>
  <div class="card s3"><div class="label">Sonno</div><div class="metric">${fmtMin(sleep)}</div></div>
  <div class="card s3"><div class="label">Non tracciato</div><div class="metric">${fmtMin(untracked)}</div></div>
  <div class="card s8"><div style="display:flex;justify-content:space-between"><h2>Routine</h2><span class="muted small">${done}/${total}</span></div>${rows}</div>
  <div class="card s4">
   <h2>Sonno</h2><p class="muted small">Puoi iniziare la notte e terminarla il giorno dopo.</p>
   <button class="btn ${sleeping?"danger":"good"}" onclick="window.mSleep()">${sleeping?"☀️ Sveglia":"🌙 A letto"}</button>
   ${d.sleep?`<p>Durata: <b>${fmtMin(sleep)}</b></p>`:""}
   <hr style="border-color:#252c39;border-width:1px 0 0;margin:18px 0">
   <button class="btn" onclick="window.mWakePrev()">Chiudi sonno della notte precedente</button>
  </div>
  <div class="card s12"><h2>Timeline 24 ore</h2>${timeline(selected)}</div>
 </div>`;
}
function timeline(d){
 const base=new Date(d);base.setHours(0,0,0,0);let out='<div class="timeline">';
 for(let h=0;h<24;h++)out+=`<div class="hour" style="top:${h/24*100}%"><span>${String(h).padStart(2,"0")}:00</span></div>`;
 const events=[...getDay(d).events];
 const s=getDay(d).sleep;if(s)events.push({name:"Sonno",start:s.start,end:s.end||Date.now(),category:"sleep"});
 events.forEach(e=>{
  const start=Math.max(e.start,base.getTime()),end=Math.min(e.end,base.getTime()+86400000);
  if(end<=start)return;
  const top=(start-base.getTime())/86400000*100,height=(end-start)/86400000*100;
  out+=`<div class="event ${e.category==="sleep"?"sleep":e.category==="free"?"free":""}" style="top:${top}%;height:${Math.max(.7,height)}%">${esc(e.name)}</div>`;
 });
 return out+"</div>";
}
function pieChart(){
 const d=getDay(selected),values=[["Attività",activityMinutes(selected),"#8b7cff"],["Sonno",sleepMinutes(selected),"#35d6b0"],["Non tracciato",Math.max(0,1440-activityMinutes(selected)-sleepMinutes(selected)),"#394155"]];
 let angle=-Math.PI/2,paths="";
 values.forEach(v=>{const a=v[1]/1440*Math.PI*2,na=angle+a,r=92,cx=120,cy=120,x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle),x2=cx+r*Math.cos(na),y2=cy+r*Math.sin(na);paths+=`<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${a>Math.PI?1:0} 1 ${x2} ${y2} Z" fill="${v[2]}"></path>`;angle=na});
 return `<svg class="chart" viewBox="0 0 240 240">${paths}<circle cx="120" cy="120" r="56" fill="#111722"/><text x="120" y="117" text-anchor="middle" fill="white" font-size="19" font-weight="800">24h</text><text x="120" y="137" text-anchor="middle" fill="#8992a5" font-size="11">distribuzione</text></svg><div class="legend">${values.map(v=>`<span><i class="dot" style="background:${v[2]}"></i>${v[0]} ${Math.round(v[1]/1440*100)}%</span>`).join("")}</div>`;
}
function lineChart(){
 const vals=[];for(let i=13;i>=0;i--){const d=new Date(selected);d.setDate(d.getDate()-i);vals.push({d,v:activityMinutes(d)+sleepMinutes(d)});}
 const W=720,H=260,p=34,max=Math.max(60,...vals.map(x=>x.v));
 const pts=vals.map((x,i)=>[p+i*(W-2*p)/(vals.length-1),H-p-(x.v/max)*(H-2*p)]);
 return `<svg class="chart" viewBox="0 0 ${W} ${H}">
 <line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="#303747"/>
 <polyline points="${pts.map(x=>x.join(",")).join(" ")}" fill="none" stroke="#8b7cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
 ${pts.map((x,i)=>`<circle cx="${x[0]}" cy="${x[1]}" r="4" fill="#35d6b0"/><text x="${x[0]}" y="${H-9}" fill="#727c90" text-anchor="middle" font-size="10">${vals[i].d.getDate()}</text>`).join("")}
 </svg>`;
}
function renderStats(){
 document.getElementById("content").innerHTML=`<div class="grid">
 <div class="card s6"><h2>Distribuzione delle 24 ore</h2>${pieChart()}</div>
 <div class="card s6"><h2>Andamento ultimi 14 giorni</h2>${lineChart()}</div>
 <div class="card s12"><h2>Tempo per attività</h2>${state.activities.map(a=>{let n=0;Object.keys(state.days).forEach(k=>{const d=state.days[k];d.events.forEach(e=>{if(e.activity===a.id)n+=(e.end-e.start)/60000})});return `<div style="margin:13px 0"><div style="display:flex;justify-content:space-between"><b>${a.icon} ${esc(a.name)}</b><span class="muted">${fmtMin(n)}</span></div><div class="progress"><span style="width:${Math.min(100,n/600*100)}%"></span></div></div>`}).join("")}</div>
 </div>`;
}
function renderCalendar(){
 const y=selected.getFullYear(),m=selected.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 let cells="";for(let i=0;i<first;i++)cells+="<div></div>";
 for(let n=1;n<=days;n++){const d=new Date(y,m,n);d.setHours(12,0,0,0);const x=getDay(d);cells+=`<button class="card daycell" onclick="window.mSelect(${y},${m},${n})"><b>${n}</b><div class="small muted">${x.events.length} eventi</div><div class="small">${x.sleep?"😴 sonno":""}</div></button>`}
 document.getElementById("content").innerHTML=`<div class="card"><h2>${selected.toLocaleDateString("it-IT",{month:"long",year:"numeric"})}</h2><div class="calendar"><div class="small">Dom</div><div class="small">Lun</div><div class="small">Mar</div><div class="small">Mer</div><div class="small">Gio</div><div class="small">Ven</div><div class="small">Sab</div>${cells}</div></div>`;
}
function renderActivities(){
 document.getElementById("content").innerHTML=`<div class="grid"><div class="card s8"><h2>Le tue attività</h2>${state.activities.map(a=>`<div class="editrow"><input class="input" value="${escAttr(a.icon)}" onchange="window.mEdit('${a.id}','icon',this.value)"><input class="input" value="${escAttr(a.name)}" onchange="window.mEdit('${a.id}','name',this.value)"><input class="input" type="number" value="${a.goal||0}" onchange="window.mEdit('${a.id}','goal',this.value)"><button class="btn danger" onclick="window.mRemove('${a.id}')">×</button></div>`).join("")}</div>
 <div class="card s4"><h2>Nuova attività</h2><div class="form"><input id="newName" class="input" placeholder="Nome"><input id="newIcon" class="input" placeholder="✨"><input id="newGoal" class="input" type="number" placeholder="min"><button class="btn primary" onclick="window.mAdd()">Aggiungi</button></div></div></div>`;
}
function renderSync(){
 document.getElementById("content").innerHTML=`<div class="grid">
 <div class="card s6"><h2>Backup locale</h2><p class="muted">Salva una copia completa delle tue attività e giornate.</p><button class="btn primary" onclick="window.exportData()">Esporta JSON</button> <label class="btn">Importa JSON<input id="importFile" type="file" accept=".json" style="display:none" onchange="window.importData(event)"></label></div>
 <div class="card s6"><h2>Supabase</h2><p class="muted">La V5 contiene lo schema SQL di base. Il collegamento cloud automatico può essere aggiunto senza cambiare il design.</p><p class="small muted">File incluso: <b>supabase.sql</b></p></div>
 </div>`;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escAttr(s){return esc(s).replace(/"/g,"&quot;")}
window.mToggle=toggleActivity;window.mTimer=timerToggle;window.mSleep=sleepToggle;window.mWakePrev=wakePreviousNight;
window.mSelect=(y,m,n)=>{selected=new Date(y,m,n);selected.setHours(12,0,0,0);nav("today")};
window.mEdit=(id,k,v)=>{const a=state.activities.find(x=>x.id===id);if(!a)return;a[k]=k==="goal"?Math.max(0,Number(v)||0):v;save()};
window.mRemove=id=>{state.activities=state.activities.filter(a=>a.id!==id);save();render()};
window.mAdd=()=>{const n=document.getElementById("newName").value.trim();if(!n)return toast("Inserisci un nome");state.activities.push({id:"a"+Date.now(),name:n,icon:document.getElementById("newIcon").value||"✨",category:"custom",goal:Number(document.getElementById("newGoal").value)||0});save();render();toast("Attività aggiunta")};
window.exportData=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="momentum-backup.json";a.click();URL.revokeObjectURL(a.href)};
window.importData=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.activities||!x.days)throw 0;state=x;save();render();toast("Backup importato")}catch(_){toast("Backup non valido")}};r.readAsText(f)};
render();
setInterval(()=>{if(activeTimer||getDay(selected).sleep&&!getDay(selected).sleep.end)render()},30000);
})();
</script>

<div id="syncModal" class="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999;align-items:center;justify-content:center;padding:20px">
  <div style="width:min(560px,100%);background:#111827;border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:24px;box-shadow:0 25px 80px rgba(0,0,0,.45)">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px">
      <div><h2 style="margin:0">☁️ Sincronizzazione</h2><p id="syncStatus" style="opacity:.75;margin:8px 0 0">Non configurata</p></div>
      <button onclick="closeSync()" style="font-size:20px">×</button>
    </div>
    <div id="syncSetup" style="margin-top:20px">
      <p style="opacity:.8;line-height:1.5">Inserisci il Project URL e la Publishable/anon key del tuo progetto Supabase. Questi dati identificano il progetto; <b>non usare mai una service_role key nel browser</b>.</p>
      <input id="sbUrl" placeholder="https://xxxxx.supabase.co" style="width:100%;margin:8px 0;padding:12px;border-radius:12px;border:1px solid #334155;background:#0b1220;color:white">
      <input id="sbKey" placeholder="sb_publishable_... oppure anon key" style="width:100%;margin:8px 0;padding:12px;border-radius:12px;border:1px solid #334155;background:#0b1220;color:white">
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
        <button onclick="saveSupabaseConfig()">Collega progetto</button>
      </div>
    </div>
    <div id="syncAuth" style="display:none;margin-top:20px">
      <input id="syncEmail" type="email" placeholder="Email" style="width:100%;margin:8px 0;padding:12px;border-radius:12px;border:1px solid #334155;background:#0b1220;color:white">
      <input id="syncPassword" type="password" placeholder="Password" style="width:100%;margin:8px 0;padding:12px;border-radius:12px;border:1px solid #334155;background:#0b1220;color:white">
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
        <button onclick="syncSignUp()">Crea account</button>
        <button onclick="syncSignIn()">Accedi</button>
        <button onclick="syncSignOut()">Esci</button>
        <button onclick="syncNow()">↻ Sincronizza</button>
      </div>
      <p id="authMsg" style="opacity:.75;line-height:1.4"></p>
    </div>
  </div>
</div>


<button onclick="openSync()" style="position:fixed;right:18px;bottom:18px;z-index:5000;padding:13px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:#2563eb;color:#fff;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3)">☁️ Sync</button>


<script>
/* Momentum Daily OS — cloud sync layer */
let sbClient = null;
let sbUser = null;
const SB_CFG_KEY = "momentum_supabase_config_v1";

function getSBConfig(){ try{return JSON.parse(localStorage.getItem(SB_CFG_KEY)||"null")}catch(e){return null} }

function openSync(){
  const m=document.getElementById("syncModal"); if(m) m.style.display="flex";
  const c=getSBConfig();
  if(c){ document.getElementById("sbUrl").value=c.url||""; document.getElementById("sbKey").value=c.key||""; initSupabase(true); }
}
function closeSync(){ const m=document.getElementById("syncModal"); if(m)m.style.display="none"; }

async function initSupabase(silent=false){
  const c=getSBConfig();
  if(!c || !window.supabase){ if(!silent) alert("Configura prima Supabase."); return; }
  try{
    sbClient=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const {data}=await sbClient.auth.getUser();
    sbUser=data?.user||null;
    updateSyncUI();
    sbClient.auth.onAuthStateChange((_event,session)=>{ sbUser=session?.user||null; updateSyncUI(); });
    if(sbUser) await syncNow(true);
  }catch(e){ console.error(e); if(!silent) alert("Errore Supabase: "+e.message); }
}
function updateSyncUI(){
  const st=document.getElementById("syncStatus"), auth=document.getElementById("syncAuth"), setup=document.getElementById("syncSetup");
  const msg=document.getElementById("authMsg");
  if(getSBConfig()){
    setup.style.display="none"; auth.style.display="block";
    st.textContent=sbUser ? "☁️ Connesso: "+(sbUser.email||"account") : "Progetto collegato — accedi per sincronizzare";
    if(msg) msg.textContent=sbUser ? "I dati vengono sincronizzati con questo account." : "";
  }else{
    setup.style.display="block"; auth.style.display="none"; st.textContent="Non configurata";
  }
}
function saveSupabaseConfig(){
  const url=document.getElementById("sbUrl").value.trim().replace(/\/$/,"");
  const key=document.getElementById("sbKey").value.trim();
  if(!/^https:\/\/.+\.supabase\.co$/.test(url) || !key){ alert("Inserisci un Project URL Supabase valido e una Publishable/anon key."); return; }
  if(/service_role/i.test(key)){ alert("Non usare una service_role key nel browser."); return; }
  localStorage.setItem(SB_CFG_KEY,JSON.stringify({url,key}));
  initSupabase(false);
}
async function syncSignUp(){
  if(!sbClient) return;
  const email=document.getElementById("syncEmail").value.trim(), password=document.getElementById("syncPassword").value;
  if(!email||password.length<6){ document.getElementById("authMsg").textContent="Inserisci email e una password di almeno 6 caratteri."; return; }
  const {error}=await sbClient.auth.signUp({email,password});
  document.getElementById("authMsg").textContent=error ? error.message : "Account creato. Se richiesto, conferma l'email e poi accedi.";
}
async function syncSignIn(){
  if(!sbClient) return;
  const email=document.getElementById("syncEmail").value.trim(), password=document.getElementById("syncPassword").value;
  const {data,error}=await sbClient.auth.signInWithPassword({email,password});
  document.getElementById("authMsg").textContent=error ? error.message : "Accesso riuscito.";
  sbUser=data?.user||null; updateSyncUI(); if(sbUser) await syncNow(true);
}
async function syncSignOut(){
  if(!sbClient) return;
  await sbClient.auth.signOut(); sbUser=null; updateSyncUI();
}
async function syncNow(silent=false){
  if(!sbClient){ if(!silent) alert("Configura Supabase prima."); return; }
  const {data:ud}=await sbClient.auth.getUser(); sbUser=ud?.user||null;
  if(!sbUser){ if(!silent) alert("Accedi prima di sincronizzare."); updateSyncUI(); return; }
  try{
    const local = JSON.parse(localStorage.getItem("momentum_v5_fixed")||"{}");
    const payload = { user_id: sbUser.id, data: local, updated_at: new Date().toISOString() };
    const {error}=await sbClient.from("momentum_user_data").upsert(payload,{onConflict:"user_id"});
    if(error) throw error;
    const {data:remote,error:readErr}=await sbClient.from("momentum_user_data").select("data,updated_at").eq("user_id",sbUser.id).maybeSingle();
    if(readErr) throw readErr;
    if(remote?.data){
      const remoteTime=new Date(remote.updated_at||0).getTime();
      const localTime=Number(local.__lastSyncLocal||0);
      if(remoteTime>localTime){
        localStorage.setItem("momentum_v5_fixed",JSON.stringify(remote.data));
        localStorage.setItem("momentum_v5_fixed_reload","1");
        location.reload();
        return;
      }
    }
    local.__lastSyncLocal=Date.now();
    localStorage.setItem("momentum_v5_fixed",JSON.stringify(local));
    document.getElementById("syncStatus").textContent="☁️ Sincronizzato ora";
    if(!silent) alert("Sincronizzazione completata.");
  }catch(e){
    console.error(e);
    if(!silent) alert("Errore durante la sincronizzazione: "+e.message);
  }
}

window.addEventListener("load",()=>{ if(getSBConfig()) initSupabase(true); });
</script>

</body>
</html>
